# Tiny Tapeout project information
project:
  title:        "TODO: JS protocol emu"      # Project title
  author:       "Callum Thomson / CUB3D"      # Your name
  discord:      "CUB3D"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A protocol emu"      # One line description of what your project does
  language:     "Amaranth" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     1000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "out.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "gpio0"
  ui[1]: "gpio1"
  ui[2]: "gpio2"
  ui[3]: "gpio3"
  ui[4]: "mosi"
  ui[5]: "ss"
  ui[6]: "sclk"
  ui[7]: ""

  # Outputs
  uo[0]: "gpio0"
  uo[1]: "gpio1"
  uo[2]: "gpio2"
  uo[3]: "gpio3"
  uo[4]: "miso"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
